<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC402 Arrays | Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-[#0f172a] text-slate-300 font-sans antialiased flex flex-col min-h-screen">

    <header id="dynamic-header" class="fixed w-full top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800"></header>

    <main class="flex-grow pt-32 pb-20 px-4">
        <div class="max-w-4xl mx-auto">
            
            <div class="glow-card bg-[#1e293b] rounded-2xl p-8 mb-16" x-data="{ answer: '', result: '' }">
                <h2 class="text-2xl font-bold text-white mb-4">Quick Check</h2>
                <p class="mb-4 text-lg">If we declare <code class="bg-slate-800 px-2 py-1 rounded text-sky-400 font-mono">int x[5];</code>, what is the index number of the <strong>last</strong> element?</p>
                
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" x-model="answer" placeholder="Type answer (e.g., 1)" 
                           class="flex-1 bg-[#0f172a] border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-sky-500 focus:outline-none transition">
                    
                    <button @click="result = (answer === '4') ? 'Correct! The size is 5, so the last index is 4.' : 'Try again. Remember: Index = Size - 1.'" 
                            class="bg-sky-500 hover:bg-sky-400 text-[#0f172a] font-bold px-8 py-3 rounded-lg transition shadow-lg shadow-sky-500/20">
                        Check
                    </button>
                </div>
                
                <p class="mt-4 font-bold text-lg" 
                   :class="answer === '4' ? 'text-green-400' : 'text-red-400'" 
                   x-text="result"></p>
            </div>

            <h2 class="text-3xl font-bold text-white mb-6 text-center">Final Assessment</h2>
            <p class="text-center text-slate-400 mb-8">Complete the Google Form below to finish the module.</p>
            
            <div class="w-full h-[600px] bg-white rounded-xl overflow-hidden shadow-2xl border border-slate-700">
                 <div class="h-full flex flex-col items-center justify-center bg-slate-200 text-slate-500">
                    <span class="text-4xl mb-4">📝</span>
                    <p>[ Paste Google Form Embed Code Here ]</p>
                 </div>
            </div>

        </div>
    </main>

    <footer id="dynamic-footer" class="bg-[#0b1120] border-t border-slate-800 pt-16 pb-8"></footer>

    <script src="script.js"></script>

</body>
</html>
