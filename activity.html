<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC402 Arrays | Mastery Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, .font-mono { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
        
        /* Smooth fade animation */
        .fade-enter { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-300 antialiased flex flex-col min-h-screen">

    <header class="fixed w-full top-0 z-50 bg-[#0f172a]/90 backdrop-blur border-b border-slate-800 h-16 flex items-center px-8">
        <span class="font-bold text-sky-500 tracking-wider">CSC402 MODULE 5</span>
    </header>

    <main class="flex-grow pt-32 pb-20 px-4 md:px-8 relative" x-data="quizEngine()">
        <div class="max-w-3xl mx-auto">

            <div x-show="state === 'intro'" class="text-center py-12 fade-enter">
                <div class="inline-block p-4 rounded-full bg-sky-900/30 mb-6 border border-sky-500/30">
                    <span class="text-5xl">⚡️</span>
                </div>
                <h1 class="text-4xl md:text-6xl font-black text-white mb-6">Array <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">Mastery</span> Quiz</h1>
                <p class="text-xl text-slate-400 mb-12 max-w-xl mx-auto leading-relaxed">
                    15 Questions. From basic memory concepts to complex looping logic. <br>Are you ready to prove your skills?
                </p>
                <button @click="startQuiz()" class="bg-sky-500 hover:bg-sky-400 text-white text-xl font-bold px-12 py-4 rounded-full shadow-lg shadow-sky-500/20 transition transform hover:scale-105">
                    Start Challenge
                </button>
            </div>

            <div x-show="state === 'quiz'" x-cloak class="fade-enter">

                <div class="mb-8">
                    <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">
                        <span>Question <span x-text="currentIndex + 1"></span> of <span x-text="questions.length"></span></span>
                        <span x-text="Math.round(((currentIndex + 1) / questions.length) * 100) + '%'"></span>
                    </div>
                    <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                        <div class="h-full bg-sky-500 transition-all duration-500 ease-out" :style="'width: ' + (((currentIndex + 1) / questions.length) * 100) + '%'"></div>
                    </div>
                </div>

                <div class="bg-[#1e293b] rounded-2xl border border-slate-700 shadow-2xl p-6 md:p-10 relative min-h-[400px] flex flex-col">

                    <div class="mb-6">
                        <span class="px-3 py-1 rounded text-xs font-bold uppercase tracking-wider bg-slate-700 text-slate-300" x-text="questions[currentIndex].category"></span>
                    </div>

                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-8 leading-snug" x-html="questions[currentIndex].text"></h2>

                    <template x-if="questions[currentIndex].type === 'mcq'">
                        <div class="space-y-3 flex-grow">
                            <template x-for="(option, idx) in questions[currentIndex].options" :key="idx">
                                <button @click="selectAnswer(idx)" 
                                        class="w-full text-left p-4 rounded-xl border border-slate-700 hover:bg-slate-800 transition flex items-center group"
                                        :class="{'bg-sky-900/30 border-sky-500 ring-1 ring-sky-500': userAnswers[currentIndex] === idx}">
                                    <div class="w-8 h-8 rounded-full border-2 border-slate-500 mr-4 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:border-sky-500 group-hover:text-sky-400 transition"
                                         :class="{'bg-sky-500 border-sky-500 text-white': userAnswers[currentIndex] === idx}"
                                         x-text="['A','B','C','D'][idx]"></div>
                                    <span class="text-lg font-mono text-slate-300 group-hover:text-white" x-html="option"></span>
                                </button>
                            </template>
                        </div>
                    </template>

                    <template x-if="questions[currentIndex].type === 'input'">
                        <div class="flex-grow flex flex-col justify-center">
                            <input type="text" x-model="textInput" 
                                   @input="userAnswers[currentIndex] = textInput"
                                   @keydown.enter="nextQuestion()"
                                   placeholder="Type your answer here..." 
                                   class="w-full bg-[#0b1120] border-2 border-slate-700 rounded-xl px-6 py-4 text-white text-xl font-mono focus:outline-none focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition placeholder-slate-600">
                            <p class="text-sm text-slate-500 mt-4 text-center">Press Enter or click Next to save.</p>
                        </div>
                    </template>

                    <div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-800">
                        <button @click="prevQuestion()" 
                                class="text-slate-400 hover:text-white font-bold px-4 py-2 rounded-lg transition disabled:opacity-30"
                                :disabled="currentIndex === 0">
                            ← Back
                        </button>
                        <button @click="nextQuestion()" 
                                class="bg-white text-slate-900 hover:bg-sky-50 font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105 disabled:opacity-50 disabled:scale-100 disabled:cursor-not-allowed"
                                :disabled="userAnswers[currentIndex] === undefined || userAnswers[currentIndex] === ''">
                            <span x-text="currentIndex === questions.length - 1 ? 'Finish Quiz' : 'Next Question →'"></span>
                        </button>
                    </div>

                </div>
            </div>

            <div x-show="state === 'result'" x-cloak class="fade-enter">
                <div class="bg-[#1e293b] rounded-3xl border border-slate-700 shadow-2xl overflow-hidden">
                    <div class="bg-slate-900/50 p-12 text-center border-b border-slate-800">
                        <div class="inline-block mb-4 text-6xl">
                            <span x-show="scorePercentage >= 80">🏆</span>
                            <span x-show="scorePercentage >= 50 && scorePercentage < 80">👍</span>
                            <span x-show="scorePercentage < 50">📚</span>
                        </div>
                        <h2 class="text-4xl font-black text-white mb-2">Quiz Complete!</h2>
                        <div class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-sky-500 my-6" x-text="scorePercentage + '%'"></div>
                        <p class="text-xl text-slate-400" x-text="getFeedback()"></p>
                    </div>

                    <div class="p-8 md:p-12">
                        <h3 class="text-white font-bold text-xl mb-6">Detailed Breakdown</h3>
                        <div class="space-y-4">
                            <template x-for="(q, idx) in questions" :key="idx">
                                <div class="p-4 rounded-xl border flex items-start gap-4 transition hover:bg-slate-800/50"
                                     :class="isCorrect(idx) ? 'bg-green-900/10 border-green-500/20' : 'bg-red-900/10 border-red-500/20'">
                                    <div class="shrink-0 mt-1">
                                        <span x-show="isCorrect(idx)" class="text-green-400 text-xl">✅</span>
                                        <span x-show="!isCorrect(idx)" class="text-red-400 text-xl">❌</span>
                                    </div>
                                    <div class="w-full">
                                        <p class="text-white font-bold text-sm mb-2" x-html="q.text"></p>
                                        <div class="flex flex-col md:flex-row gap-4 text-xs">
                                            <div class="flex-1">
                                                <span class="text-slate-500 block mb-1">Your Answer:</span>
                                                <span class="font-mono text-white bg-slate-800 px-2 py-1 rounded border border-slate-600" x-text="formatAnswer(idx)"></span>
                                            </div>
                                            <div class="flex-1" x-show="!isCorrect(idx)">
                                                <span class="text-green-400 block mb-1">Correct Answer:</span>
                                                <span class="font-mono text-green-300 bg-green-900/30 px-2 py-1 rounded border border-green-500/30" x-text="formatCorrectAnswer(idx)"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <div class="mt-12 text-center">
                            <button @click="resetQuiz()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-8 py-3 rounded-full transition shadow-lg">Try Again</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-[#0b1120] border-t border-slate-800 pt-12 pb-8 text-center text-slate-600 text-sm">
        <p>&copy; 2023 Computer Science Department</p>
    </footer>

    <script>
        function quizEngine() {
            return {
                state: 'intro', // intro, quiz, result
                currentIndex: 0,
                textInput: '',
                userAnswers: [], // Stores user responses
                scorePercentage: 0,

                // --- THE QUESTION BANK ---
                questions: [
                    // TOPIC 5.1: Intro & Memory
                    {
                        category: '5.1 Concept',
                        type: 'mcq',
                        text: 'An array is a collection of elements of the ______ data type stored in ______ memory locations.',
                        options: ['different, random', 'same, contiguous', 'same, random', 'different, contiguous'],
                        correct: 1
                    },
                    {
                        category: '5.1 Memory',
                        type: 'mcq',
                        text: 'If an integer (4 bytes) at index [0] is at address 1000, what is the address of index [3]?',
                        options: ['1003', '1004', '1012', '1008'],
                        correct: 2 // 1000 + (3 * 4) = 1012
                    },
                    {
                        category: '5.1 Logic',
                        type: 'mcq',
                        text: 'Why do we use 0-based indexing in C++?',
                        options: ['Because C++ was invented in year 0', 'It represents the offset from the start address', 'It saves memory space', 'It makes the code look cooler'],
                        correct: 1
                    },

                    // TOPIC 5.2: Declaration
                    {
                        category: '5.2 Syntax',
                        type: 'mcq',
                        text: 'Which of the following array declarations is <strong>INVALID</strong>?',
                        options: ['int arr[5];', 'int arr[] = {1, 2, 3};', 'int arr[3] = {1, 2, 3};', 'int arr[3] = {1, 2, 3, 4};'],
                        correct: 3 // Too many initializers
                    },
                    {
                        category: '5.2 Syntax',
                        type: 'mcq',
                        text: 'What happens if you declare <code>int x[5] = {10};</code>?',
                        options: ['x[0]=10, others=garbage', 'x[0]=10, others=0', 'All elements are 10', 'Compiler Error'],
                        correct: 1
                    },
                    {
                        category: '5.2 Code',
                        type: 'input',
                        text: 'Write code to declare an integer array named <code>prices</code> with size 10.',
                        correct: ['int prices[10];', 'int prices[10]']
                    },

                    // TOPIC 5.3: Accessing
                    {
                        category: '5.3 Access',
                        type: 'mcq',
                        text: 'If <code>int arr[5]</code> is declared, what is the index of the <strong>last</strong> element?',
                        options: ['5', '4', '6', '0'],
                        correct: 1
                    },
                    {
                        category: '5.3 Debugging',
                        type: 'mcq',
                        text: 'What happens when you access <code>arr[10]</code> in an array of size 5?',
                        options: ['It returns 0', 'It automatically resizes the array', 'Index Out of Bounds (Undefined Behavior)', 'It returns -1'],
                        correct: 2
                    },

                    // TOPIC 5.3: Looping
                    {
                        category: '5.3 Loops',
                        type: 'input',
                        text: 'Complete the loop condition to iterate through all 10 elements: <br><code>for(int i=0; _______; i++)</code>',
                        correct: ['i<10', 'i < 10', 'i<=9', 'i <= 9']
                    },
                    {
                        category: '5.3 Logic',
                        type: 'mcq',
                        text: 'Which loop correctly calculates the sum of an array <code>arr</code> of size <code>N</code>?',
                        // NOTE: using &lt; instead of < to prevent HTML rendering issues
                        options: [
                            'for(int i=0; i&lt;=N; i++) sum += arr[i];', // goes out of bounds
                            'for(int i=1; i&lt;N; i++) sum += arr[i];',  // skips index 0
                            'for(int i=0; i&lt;N; i++) sum += arr[i];',  // Correct
                            'for(int i=0; i&lt;N; i++) sum = arr[i];'    // overwrites sum
                        ],
                        correct: 2
                    },

                    // TOPIC 5.6: Strings
                    {
                        category: '5.6 Strings',
                        type: 'mcq',
                        text: 'What special character must end a C-style string?',
                        options: ['/n', '\\0 (Null Terminator)', '.', 'END'],
                        correct: 1
                    },
                    {
                        category: '5.6 Memory',
                        type: 'mcq',
                        text: 'How many bytes are needed to store the string <code>"Hello"</code>?',
                        options: ['5 bytes', '6 bytes', '4 bytes', '8 bytes'],
                        correct: 1 // 5 chars + 1 null terminator
                    },

                    // ADVANCED / TRICKY
                    {
                        category: 'Logic Trace',
                        type: 'mcq',
                        text: '<code>int a[3]={10,20,30}; a[0]=a[1]; a[1]=a[2];</code> <br>What is in a[0] now?',
                        options: ['10', '20', '30', '0'],
                        correct: 1
                    },
                    {
                        category: 'Syntax',
                        type: 'input',
                        text: 'What keyword is used to make an array size variable read-only? (e.g., ___ int SIZE = 5;)',
                        correct: ['const', 'CONST']
                    },
                    {
                        category: 'Final Boss',
                        type: 'mcq',
                        text: 'Can arrays in C++ change their size after declaration?',
                        options: ['Yes, always', 'Yes, but only if they are empty', 'No, size is fixed', 'Yes, using realloc()'],
                        correct: 2
                    }
                ],

                // --- FUNCTIONS ---

                startQuiz() {
                    this.state = 'quiz';
                    this.currentIndex = 0;
                    this.userAnswers = new Array(this.questions.length);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                selectAnswer(index) {
                    this.userAnswers[this.currentIndex] = index;
                },

                nextQuestion() {
                    // Logic to move to next or finish
                    if (this.currentIndex < this.questions.length - 1) {
                        this.currentIndex++;
                        // If next is input, sync the text field with stored answer (if any)
                        if(this.questions[this.currentIndex].type === 'input') {
                            this.textInput = this.userAnswers[this.currentIndex] || '';
                        }
                    } else {
                        this.calculateScore();
                    }
                },

                prevQuestion() {
                    if (this.currentIndex > 0) {
                        this.currentIndex--;
                        if(this.questions[this.currentIndex].type === 'input') {
                            this.textInput = this.userAnswers[this.currentIndex] || '';
                        }
                    }
                },

                calculateScore() {
                    let correctCount = 0;
                    this.questions.forEach((q, i) => {
                        // Check MCQ
                        if (q.type === 'mcq') {
                            if (this.userAnswers[i] === q.correct) correctCount++;
                        } 
                        // Check Input
                        else if (q.type === 'input') {
                            // Normalize answer: trim whitespace
                            const userTxt = (this.userAnswers[i] || '').trim();
                            if (q.correct.includes(userTxt)) correctCount++;
                        }
                    });
                    
                    this.scorePercentage = Math.round((correctCount / this.questions.length) * 100);
                    this.state = 'result';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                isCorrect(idx) {
                    const q = this.questions[idx];
                    const ans = this.userAnswers[idx];
                    
                    if (q.type === 'mcq') return ans === q.correct;
                    if (q.type === 'input') return q.correct.includes((ans || '').trim());
                    return false;
                },

                // Helpers for Result Screen
                formatAnswer(idx) {
                    const q = this.questions[idx];
                    const ans = this.userAnswers[idx];
                    
                    if (ans === undefined || ans === '') return '(No Answer)';
                    if (q.type === 'mcq') {
                        // We need to decode html entities for display if we want, 
                        // but sticking to raw string is safer for simplicity here.
                        // However, since options contain &lt;, let's use a temp element to decode if needed,
                        // or just rely on x-text/x-html. 
                        // Here we return the raw string from options array.
                        return q.options[ans].replace(/&lt;/g, '<'); 
                    }
                    return ans;
                },

                formatCorrectAnswer(idx) {
                    const q = this.questions[idx];
                    if (q.type === 'mcq') return q.options[q.correct].replace(/&lt;/g, '<');
                    return q.correct[0]; // Return first valid text option
                },

                getFeedback() {
                    if (this.scorePercentage === 100) return "Perfect Score! You are undeniably a Master.";
                    if (this.scorePercentage >= 80) return "Excellent work! You have a solid grasp of arrays.";
                    if (this.scorePercentage >= 60) return "Good effort. Review the syntax and memory sections.";
                    return "Don't give up! Re-read the Learn module and try again.";
                },

                resetQuiz() {
                    this.state = 'intro';
                    this.currentIndex = 0;
                    this.userAnswers = [];
                    this.textInput = '';
                }
            }
        }
    </script>
</body>
</html>
