<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC402 Arrays | Mastery Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        [x-cloak] { display: none !important; }
        .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-pulse-red { animation: pulseRed 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseRed { 0%, 100% { opacity: 1; color: #ef4444; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-300 font-sans antialiased flex flex-col min-h-screen">

    <header id="dynamic-header" class="fixed w-full top-0 z-50 bg-[#0f172a] border-b border-slate-800"></header>

    <main class="flex-grow pt-32 pb-20 px-4 md:px-8 relative" x-data="quizEngine()">
        <div class="max-w-3xl mx-auto">

            <div x-show="state === 'intro'" class="text-center py-12 fade-enter">
                <div class="inline-block p-4 rounded-full bg-sky-900/30 mb-6 border border-sky-500/30">
                    <span class="text-5xl">⚡️</span>
                </div>
                <h1 class="text-4xl md:text-6xl font-black text-white mb-6">Array <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">Mastery</span> Quiz</h1>
                <p class="text-xl text-slate-400 mb-8 max-w-xl mx-auto leading-relaxed">
                    15 Questions. Randomized.<br>
                    <span class="text-white font-bold">⏱️ Time Limit: 5 Minutes.</span>
                </p>
                <div class="flex justify-center gap-4">
                    <button @click="startQuiz()" class="bg-sky-500 hover:bg-sky-400 text-white text-xl font-bold px-12 py-4 rounded-full shadow-lg shadow-sky-500/20 transition transform hover:scale-105">
                        Start Challenge
                    </button>
                </div>
            </div>

            <div x-show="state === 'quiz'" x-cloak class="fade-enter">

                <div class="flex flex-col md:flex-row md:items-end justify-between mb-6 gap-4">
                    
                    <div class="flex-grow md:max-w-md order-2 md:order-1">
                        <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">
                            <span>Progress</span>
                            <span x-text="Math.round((answeredCount() / questions.length) * 100) + '%'"></span>
                        </div>
                        <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-sky-500 transition-all duration-500 ease-out" :style="'width: ' + ((answeredCount() / questions.length) * 100) + '%'"></div>
                        </div>
                    </div>

                    <div class="order-1 md:order-2 flex items-center justify-center gap-3 bg-slate-800/80 rounded-lg px-6 py-3 border border-slate-700 w-full md:w-auto shadow-md"
                         :class="{'border-red-500/50 bg-red-900/20': timeLeft <= 60}">
                        <span class="text-xl">⏱️</span>
                        <span class="text-2xl font-mono font-bold text-white tracking-widest" 
                              :class="{'animate-pulse-red': timeLeft <= 60}"
                              x-text="formatTime(timeLeft)"></span>
                    </div>
                </div>

                <div class="mb-8">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 text-center md:text-left">Question Map</p>
                    <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                        <template x-for="(q, idx) in questions" :key="idx">
                            <button @click="currentIndex = idx; if(questions[currentIndex].type === 'input') textInput = userAnswers[currentIndex] || '';"
                                    class="w-10 h-10 rounded-lg text-sm font-bold transition border-2 flex items-center justify-center relative group"
                                    :class="{
                                        'bg-sky-500 border-sky-500 text-white shadow-[0_0_15px_rgba(14,165,233,0.5)] scale-110 z-10': currentIndex === idx,
                                        'bg-sky-900/20 border-sky-500/50 text-sky-400': currentIndex !== idx && hasAnswered(idx),
                                        'bg-slate-800 border-slate-700 text-slate-600 hover:border-slate-500': currentIndex !== idx && !hasAnswered(idx)
                                    }">
                                <span x-text="idx + 1"></span>
                                <span x-show="hasAnswered(idx)" class="absolute -top-1 -right-1 w-2 h-2 bg-sky-400 rounded-full"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="bg-[#1e293b] rounded-2xl border border-slate-700 shadow-2xl p-6 md:p-10 relative min-h-[400px] flex flex-col">

                    <div class="mb-6 flex justify-between items-start">
                        <span class="px-3 py-1 rounded text-xs font-bold uppercase tracking-wider bg-slate-700 text-slate-300" x-text="questions[currentIndex].category"></span>
                        <span class="text-xs text-slate-500 font-mono">ID: #<span x-text="currentIndex + 1"></span></span>
                    </div>

                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-8 leading-snug" x-html="questions[currentIndex].text"></h2>

                    <template x-if="questions[currentIndex].type === 'mcq'">
                        <div class="space-y-3 flex-grow">
                            <template x-for="(option, idx) in questions[currentIndex].options" :key="idx">
                                <button @click="selectAnswer(idx)" 
                                        class="w-full text-left p-4 rounded-xl border border-slate-700 hover:bg-slate-800 transition flex items-center group"
                                        :class="{'bg-sky-900/30 border-sky-500 ring-1 ring-sky-500': userAnswers[currentIndex] === idx}">
                                    <div class="w-8 h-8 shrink-0 rounded-full border-2 border-slate-500 mr-4 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:border-sky-500 group-hover:text-sky-400 transition"
                                         :class="{'bg-sky-500 border-sky-500 text-white': userAnswers[currentIndex] === idx}"
                                         x-text="['A','B','C','D'][idx]"></div>
                                    <span class="text-lg font-mono" x-html="option"></span>
                                </button>
                            </template>
                        </div>
                    </template>

                    <template x-if="questions[currentIndex].type === 'input'">
                        <div class="flex-grow flex flex-col justify-center">
                            <input type="text" x-model="textInput" 
                                   @input="userAnswers[currentIndex] = textInput"
                                   placeholder="Type your answer here..." 
                                   class="w-full bg-[#0b1120] border-2 border-slate-700 rounded-xl px-6 py-4 text-white text-xl font-mono focus:outline-none focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition">
                            <p class="text-sm text-slate-500 mt-4 text-center">Press Enter or click Next to submit.</p>
                        </div>
                    </template>

                    <div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-800">
                        <button @click="prevQuestion()" 
                                class="text-slate-400 hover:text-white font-bold px-4 py-2 rounded-lg transition disabled:opacity-30"
                                :disabled="currentIndex === 0">
                            ← Back
                        </button>
                        
                        <template x-if="currentIndex === questions.length - 1">
                            <button @click="calculateScore()" 
                                    class="bg-green-600 hover:bg-green-500 text-white font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105">
                                Finish Quiz & Submit
                            </button>
                        </template>

                        <template x-if="currentIndex < questions.length - 1">
                            <button @click="nextQuestion()" 
                                    class="bg-white text-slate-900 hover:bg-sky-50 font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105">
                                Next Question →
                            </button>
                        </template>
                    </div>

                </div>
            </div>

            <div x-show="state === 'result'" x-cloak class="fade-enter">
                <div class="bg-[#1e293b] rounded-3xl border border-slate-700 shadow-2xl overflow-hidden">
                    
                    <div class="bg-slate-900/50 p-8 text-center border-b border-slate-800">
                        <div x-show="timeRunOut" class="inline-block bg-red-500/20 text-red-400 px-3 py-1 rounded text-xs font-bold mb-4 border border-red-500/30">⏰ Time's Up!</div>
                        <h2 class="text-2xl font-black text-white mb-2">Quiz Complete!</h2>
                        <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-sky-500 my-2" x-text="scorePercentage + '%'"></div>
                        <p class="text-md text-slate-400" x-text="getFeedback()"></p>
                    </div>

                    <div class="p-6 md:p-10 relative min-h-[300px] flex flex-col">
                        
                        <div class="flex justify-between text-xs font-bold text-slate-500 mb-4 uppercase tracking-widest">
                            <span>Reviewing Question <span x-text="reviewIndex + 1"></span> of <span x-text="questions.length"></span></span>
                            <span x-show="isCorrect(reviewIndex)" class="text-green-400">Correct ✅</span>
                            <span x-show="!isCorrect(reviewIndex)" class="text-red-400">Incorrect ❌</span>
                        </div>

                        <h3 class="text-xl md:text-2xl font-bold text-white mb-6" x-html="questions[reviewIndex].text"></h3>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            <div class="p-4 rounded-xl border" 
                                 :class="isCorrect(reviewIndex) ? 'bg-green-900/10 border-green-500/30' : 'bg-red-900/10 border-red-500/30'">
                                <p class="text-xs text-slate-400 uppercase font-bold mb-2">Your Answer</p>
                                <p class="font-mono text-white text-lg break-words" x-text="formatAnswer(reviewIndex)"></p>
                            </div>

                            <div x-show="!isCorrect(reviewIndex)" class="p-4 rounded-xl border bg-slate-800/50 border-slate-600">
                                <p class="text-xs text-slate-400 uppercase font-bold mb-2">Correct Answer</p>
                                <p class="font-mono text-green-400 text-lg break-words" x-text="formatCorrectAnswer(reviewIndex)"></p>
                            </div>
                            
                            <div x-show="isCorrect(reviewIndex)" class="hidden md:block p-4 rounded-xl border bg-slate-800/30 border-slate-700 flex items-center justify-center">
                                <p class="text-green-400 font-bold">Good Job! 👍</p>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row justify-between items-center mt-auto pt-6 border-t border-slate-800 gap-4">
                            <button @click="reviewIndex > 0 ? reviewIndex-- : null" 
                                    class="w-full md:w-auto text-slate-400 hover:text-white font-bold px-4 py-2 rounded-lg transition disabled:opacity-30 order-2 md:order-1"
                                    :disabled="reviewIndex === 0">
                                ← Previous
                            </button>
                            
                            <button @click="resetQuiz()" class="w-full md:w-auto bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-2 rounded-lg transition shadow-md order-1 md:order-2 border border-slate-600">
                                ↺ Restart Quiz
                            </button>

                            <button @click="reviewIndex < questions.length - 1 ? reviewIndex++ : null" 
                                    class="w-full md:w-auto bg-white text-slate-900 hover:bg-sky-50 font-bold px-6 py-2 rounded-full shadow-lg transition transform hover:scale-105 disabled:opacity-50 disabled:scale-100 order-3"
                                    :disabled="reviewIndex === questions.length - 1">
                                Next →
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer id="dynamic-footer" class="bg-[#0b1120] border-t border-slate-800 pt-16 pb-8"></footer>

    <script src="script.js"></script>
    <script>
        function quizEngine() {
            return {
                state: 'intro', 
                currentIndex: 0,
                reviewIndex: 0,
                textInput: '',
                userAnswers: [],
                questions: [], 
                scorePercentage: 0,
                
                // TIMER VARIABLES: Reduced to 300 seconds (5 Minutes)
                timer: null,
                totalTime: 300, 
                timeLeft: 300,
                timeRunOut: false,

                // --- MASTER QUESTION BANK ---
                masterQuestions: [
                    // TOPIC 5.1
                    {
                        category: '5.1 Concept',
                        type: 'mcq',
                        text: 'An array is a collection of elements of the ______ data type stored in ______ memory locations.',
                        options: ['different, random', 'same, contiguous', 'same, random', 'different, contiguous'],
                        correct: 1
                    },
                    {
                        category: '5.1 Memory',
                        type: 'mcq',
                        text: 'If an integer (4 bytes) at index [0] is at address 1000, what is the address of index [3]?',
                        options: ['1003', '1004', '1012', '1008'],
                        correct: 2 
                    },
                    {
                        category: '5.1 Logic',
                        type: 'mcq',
                        text: 'Why do we use 0-based indexing in C++?',
                        options: ['Because C++ was invented in year 0', 'It represents the offset from the start address', 'It saves memory space', 'It makes the code look cooler'],
                        correct: 1
                    },
                    // TOPIC 5.2
                    {
                        category: '5.2 Syntax',
                        type: 'mcq',
                        text: 'Which of the following array declarations is <strong>INVALID</strong>?',
                        options: ['int arr[5];', 'int arr[] = {1, 2, 3};', 'int arr[3] = {1, 2, 3};', 'int arr[3] = {1, 2, 3, 4};'],
                        correct: 3 
                    },
                    {
                        category: '5.2 Syntax',
                        type: 'mcq',
                        text: 'What happens if you declare <code>int x[5] = {10};</code>?',
                        options: ['x[0]=10, others=garbage', 'x[0]=10, others=0', 'All elements are 10', 'Compiler Error'],
                        correct: 1
                    },
                    {
                        category: '5.2 Code',
                        type: 'input',
                        text: 'Write code to declare an integer array named <code>prices</code> with size 10.',
                        correct: ['int prices[10];', 'int prices[10]']
                    },
                    // TOPIC 5.3
                    {
                        category: '5.3 Access',
                        type: 'mcq',
                        text: 'If <code>int arr[5]</code> is declared, what is the index of the <strong>last</strong> element?',
                        options: ['5', '4', '6', '0'],
                        correct: 1
                    },
                    {
                        category: '5.3 Debugging',
                        type: 'mcq',
                        text: 'What happens when you access <code>arr[10]</code> in an array of size 5?',
                        options: ['It returns 0', 'It automatically resizes the array', 'Index Out of Bounds (Undefined Behavior)', 'It returns -1'],
                        correct: 2
                    },
                    {
                        category: '5.3 Loops',
                        type: 'input',
                        text: 'Complete the loop condition to iterate through all 10 elements: <br><code>for(int i=0; _______; i++)</code>',
                        correct: ['i<10', 'i < 10', 'i<=9', 'i <= 9']
                    },
                    {
                        category: '5.3 Logic',
                        type: 'mcq',
                        text: 'Which loop correctly calculates the sum of an array <code>arr</code> of size <code>N</code>?',
                        options: [
                            'for(int i=0; i &lt;= N; i++) sum += arr[i];',
                            'for(int i=1; i &lt; N; i++) sum += arr[i];',
                            'for(int i=0; i &lt; N; i++) sum += arr[i];',
                            'for(int i=0; i &lt; N; i++) sum = arr[i];'
                        ],
                        correct: 2
                    },
                    // TOPIC 5.6
                    {
                        category: '5.6 Strings',
                        type: 'mcq',
                        text: 'What special character must end a C-style string?',
                        options: ['/n', '\\0 (Null Terminator)', '.', 'END'],
                        correct: 1
                    },
                    {
                        category: '5.6 Memory',
                        type: 'mcq',
                        text: 'How many bytes are needed to store the string <code>"Hello"</code>?',
                        options: ['5 bytes', '6 bytes', '4 bytes', '8 bytes'],
                        correct: 1 
                    },
                    // ADVANCED
                    {
                        category: 'Logic Trace',
                        type: 'mcq',
                        text: '<code>int a[3]={10,20,30}; a[0]=a[1]; a[1]=a[2];</code> <br>What is in a[0] now?',
                        options: ['10', '20', '30', '0'],
                        correct: 1
                    },
                    {
                        category: 'Syntax',
                        type: 'input',
                        text: 'What keyword is used to make an array size variable read-only? (e.g., ___ int SIZE = 5;)',
                        correct: ['const', 'CONST']
                    },
                    {
                        category: 'Final Boss',
                        type: 'mcq',
                        text: 'Can arrays in C++ change their size after declaration?',
                        options: ['Yes, always', 'Yes, but only if they are empty', 'No, size is fixed', 'Yes, using realloc()'],
                        correct: 2
                    }
                ],

                // --- HELPER FUNCTIONS ---

                shuffleArray(array) {
                    let currentIndex = array.length, randomIndex;
                    while (currentIndex != 0) {
                        randomIndex = Math.floor(Math.random() * currentIndex);
                        currentIndex--;
                        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                    }
                    return array;
                },

                startQuiz() {
                    // Deep copy and shuffle
                    this.questions = this.shuffleArray(JSON.parse(JSON.stringify(this.masterQuestions)));
                    
                    this.state = 'quiz';
                    this.currentIndex = 0;
                    this.userAnswers = new Array(this.questions.length).fill('');
                    this.textInput = '';
                    this.timeRunOut = false;
                    
                    // Start Timer
                    this.timeLeft = this.totalTime;
                    this.timer = setInterval(() => {
                        if (this.timeLeft > 0) {
                            this.timeLeft--;
                        } else {
                            this.timeRunOut = true;
                            this.calculateScore(); // Auto submit
                        }
                    }, 1000);

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                selectAnswer(index) {
                    this.userAnswers[this.currentIndex] = index;
                },

                hasAnswered(idx) {
                    return this.userAnswers[idx] !== '' && this.userAnswers[idx] !== undefined && this.userAnswers[idx] !== null;
                },

                answeredCount() {
                    return this.userAnswers.filter(a => a !== '' && a !== undefined && a !== null).length;
                },

                nextQuestion() {
                    if (this.currentIndex < this.questions.length - 1) {
                        this.currentIndex++;
                        if(this.questions[this.currentIndex].type === 'input') {
                            this.textInput = this.userAnswers[this.currentIndex] || '';
                        }
                    } 
                },

                prevQuestion() {
                    if (this.currentIndex > 0) {
                        this.currentIndex--;
                        if(this.questions[this.currentIndex].type === 'input') {
                            this.textInput = this.userAnswers[this.currentIndex] || '';
                        }
                    }
                },

                calculateScore() {
                    clearInterval(this.timer);

                    let correctCount = 0;
                    this.questions.forEach((q, i) => {
                        if (q.type === 'mcq') {
                            if (this.userAnswers[i] === q.correct) correctCount++;
                        } else if (q.type === 'input') {
                            const userTxt = (this.userAnswers[i] || '').trim();
                            if (q.correct.includes(userTxt)) correctCount++;
                        }
                    });
                    this.scorePercentage = Math.round((correctCount / this.questions.length) * 100);
                    this.state = 'result';
                    this.reviewIndex = 0; 
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m}:${s < 10 ? '0' : ''}${s}`;
                },

                isCorrect(idx) {
                    const q = this.questions[idx];
                    const ans = this.userAnswers[idx];
                    if (q.type === 'mcq') return ans === q.correct;
                    if (q.type === 'input') return q.correct.includes((ans || '').trim());
                    return false;
                },

                formatAnswer(idx) {
                    const q = this.questions[idx];
                    const ans = this.userAnswers[idx];
                    if (ans === undefined || ans === '') return '(No Answer)';
                    if (q.type === 'mcq') return q.options[ans].replace(/&lt;/g, '<');
                    return ans;
                },

                formatCorrectAnswer(idx) {
                    const q = this.questions[idx];
                    if (q.type === 'mcq') return q.options[q.correct].replace(/&lt;/g, '<');
                    return q.correct[0];
                },

                getFeedback() {
                    if (this.scorePercentage === 100) return "Perfect Score! You are undeniably a Master.";
                    if (this.scorePercentage >= 80) return "Excellent work! You have a solid grasp of arrays.";
                    if (this.scorePercentage >= 60) return "Good effort. Review the syntax and memory sections.";
                    return "Don't give up! Re-read the Learn module and try again.";
                },

                resetQuiz() {
                    clearInterval(this.timer);
                    this.state = 'intro';
                    this.currentIndex = 0;
                    this.userAnswers = [];
                    this.textInput = '';
                }
            }
        }
    </script>
</body>
</html>
